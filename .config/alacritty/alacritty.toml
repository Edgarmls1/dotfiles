# ============================================================
# Alacritty config — convertido a partir do kitty.conf
# Coloque em: ~/.config/alacritty/alacritty.toml
# ============================================================

[general]
live_config_reload = true

[window]
opacity = 0.7
blur = true
# 'blur' só tem efeito em compositores que suportam (Wayland nativo em
# alguns compositores; no X11/i3 depende do picom).
padding = { x = 4, y = 4 }
dynamic_padding = false
decorations = "full"
resize_increments = true

[font]
size = 12.0
normal = { family = "Hack Nerd Font", style = "Regular" }
bold = { family = "Hack Nerd Font", style = "Bold" }
italic = { family = "Hack Nerd Font", style = "Italic" }
bold_italic = { family = "Hack Nerd Font", style = "Bold Italic" }

[cursor]
style = { shape = "Block", blinking = "On" }
blink_interval = 500
blink_timeout = 15
thickness = 0.15
unfocused_hollow = true

[scrolling]
history = 2000

[mouse]
hide_when_typing = true

[selection]
save_to_clipboard = false

[bell]
duration = 0
animation = "Ease"

[terminal]
osc52 = "CopyPaste"

# ============================================================
# Cores
# ============================================================

[colors.primary]
background = "#181818"
foreground = "#ffffff"

[colors.selection]
text       = "#181818"
background = "#ffffff"

[colors.cursor]
text   = "#000000"
cursor = "#ffffff"

[colors.normal]
black   = "#282828"
red     = "#a35b5b"
green   = "#7f9f7f"
yellow  = "#bfa97a"
blue    = "#6f8fae"
magenta = "#9f7fac"
cyan    = "#7aa3a3"
white   = "#d0d0d0"

[colors.bright]
black   = "#3c3c3c"
red     = "#c17d7d"
green   = "#a0c0a0"
yellow  = "#d9c497"
blue    = "#8fb0d0"
magenta = "#bfa0cc"
cyan    = "#99c2c2"
white   = "#f0f0f0"

# ============================================================
# Sem equivalente direto no Alacritty (recursos exclusivos do kitty):
#   - tab_bar_style powerline / tab_separator / tab_title_template
#     (o Alacritty não tem abas nativas; use tmux ou um multiplexer)
#   - url_style / url_color, mark1/mark2/mark3
#   - active_border_color / inactive_border_color / bell_border_color
#   - progress_bar, cursor_trail, repaint_delay/input_delay/sync_to_monitor
# ============================================================

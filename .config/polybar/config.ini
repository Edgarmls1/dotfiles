;=========================================================================
;  Polybar — adaptado do teu Waybar (config.jsonc + style.css)
;  Tema monocromático: preto/branco/cinza, Hack Nerd Font
;  Ajustado pra i3/X11 (não Hyprland) — módulo de workspaces usa o
;  internal/i3 nativo do polybar, sem script custom.
;=========================================================================
;
;  - O módulo "tray" abaixo é o systray nativo do polybar em X11 — sem os
;    problemas de instabilidade que teria via XWayland no Hyprland.
;  - Polybar não tem CSS de verdade: sem :hover, sem transition, sem tooltip
;    nativo. Então o hover dos botões de workspace e as tooltips do
;    style.css não têm equivalente direto — dei o mais próximo possível.
;
;=========================================================================

[colors]
background      = #000000
fg-off          = #928374
fg-on           = #ffffff
clock-idle      = #ffffff
network-idle    = #888888
tray-bg         = #000000
tray-border     = #ffffff

[bar/main]
monitor = ${env:MONITOR:}
width = 100%
height = 28px
bottom = true
offset-x = 0
offset-y = 0

background = ${colors.background}
foreground = ${colors.network-idle}

line-size = 0
border-size = 0

padding-left = 0
padding-right = 1

module-margin = 0

font-0 = "Hack Nerd Font:style=Bold:size=11;3"

modules-left = workspaces
modules-center =
modules-right = tray sep network sep pulseaudio sep bluetooth sep cpu sep memory sep clock

tray-position = right
tray-background = ${colors.tray-bg}
tray-detached = false
tray-maxsize = 18
tray-padding = 6
; polybar não permite estilizar border/hover do tray como o
; "#tray menu" do waybar (isso é do GTK, fora do alcance do polybar)

cursor-click = pointer

wm-restack = generic

[settings]
screenchange-reload = true
pseudo-transparency = false

[module/workspaces]
type = internal/i3
pin-workspaces = true
strip-wsnumbers = false
index-sort = true
enable-click = true
enable-scroll = false
; os nomes dos workspaces já são os hanzi (definidos no config do i3 com
; "set $ws1 一" etc.), então não precisa mapear ícone nenhum aqui.

format = <label-state>
label-focused = %name%
label-focused-foreground = #000000
label-focused-background = #ffffff
label-focused-padding = 1

label-unfocused = %name%
label-unfocused-foreground = ${colors.fg-off}
label-unfocused-padding = 1

label-visible = %name%
label-visible-foreground = ${colors.fg-off}
label-visible-padding = 1

label-urgent = %name%
label-urgent-foreground = #ffffff
label-urgent-background = #fb4934
label-urgent-padding = 1

[module/sep]
type = custom/text
content = " | "
content-foreground = ${colors.fg-off}

[module/clock]
type = internal/date
interval = 1
date =  %H:%M
date-alt =  %d/%m/%y
label = %date%
label-foreground = ${colors.clock-idle}
; clique esquerdo alterna pro format-alt (comportamento padrão do internal/date
; já é assim ao clicar, sem precisar de click-left)

[module/network]
type = internal/network
; troca "wlan0" pelo nome real da tua interface (roda `ip link` pra ver)
interface = wlan0
interval = 3

format-connected =  <label-connected>
format-connected-foreground = ${colors.network-idle}
label-connected = %essid%

format-disconnected = disconnected 
format-disconnected-foreground = ${colors.network-idle}

click-left = kitty gazelle

[module/pulseaudio]
type = internal/pulseaudio

format-volume = VOL:<label-volume>
format-volume-foreground = ${colors.network-idle}
label-volume = " %percentage%%"

ramp-volume-0 = 
ramp-volume-1 = 

format-muted = "muted"
format-muted-foreground = ${colors.network-idle}

click-left = wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
click-right = pavucontrol
scroll-up = wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+ --limit 1.0
scroll-down = wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-

[module/bluetooth]
type = custom/script
exec = ~/.config/polybar/scripts/bluetooth.sh
interval = 3
click-left = kitty bluetui
format-foreground = ${colors.network-idle}

[module/cpu]
type = internal/cpu
interval = 1
format =  CPU:<label>
format-foreground = ${colors.network-idle}
label = %percentage%%
click-left = kitty btop

[module/memory]
type = internal/memory
interval = 1
format =  MEM:<label>
format-foreground = ${colors.network-idle}
label = %percentage_used%%
click-left = kitty btop
; polybar não tem tooltip nativo, então "{used}GB/{total}GB" do waybar
; não dá pra mostrar em hover; se quiser, dá pra colocar no próprio label:
; label = %percentage_used%% (%gb_used%/%gb_total%GB)

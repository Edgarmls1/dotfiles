#################################
#
#   Picom config — Edgar
#   Backend GLX + blur dual_kawase, sombra e fade
#   Tema monocromático (preto/branco), pensado pra combinar com
#   i3 + kitty + o resto do setup
#
#################################

#################################
#   Backend
#################################

backend = "glx";
vsync = true;
use-damage = true;
glx-no-stencil = true;
glx-no-rebind-pixmap = true;

#################################
#   Blur
#################################

blur: {
  method = "dual_kawase";
  strength = 6;
}

blur-background = true;
blur-background-frame = false;
blur-background-fixed = false;

blur-background-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "_GTK_FRAME_EXTENTS@:c"
];

#################################
#   Opacidade
#################################

active-opacity = 1.0;
inactive-opacity = 0.95;
frame-opacity = 1.0;
inactive-opacity-override = false;

# opacidade por janela — ajusta/remove o que não usar
# (deixe kitty com fundo próprio 0 no kitty.conf pra isso funcionar)
opacity-rule = [
  "95:class_g = 'kitty' && focused",
  "85:class_g = 'kitty' && !focused",
  "100:class_g = 'firefox'",
  "90:class_g = 'rofi'"
];

#################################
#   Sombra
#################################

shadow = true;
shadow-radius = 14;
shadow-opacity = 0.55;
shadow-offset-x = -14;
shadow-offset-y = -14;
shadow-color = "#000000";

shadow-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "window_type = 'tooltip'",
  "class_g = 'i3lock'",
  "_GTK_FRAME_EXTENTS@:c"
];

#################################
#   Fade
#################################

fading = false;

#################################
#   Cantos arredondados
#################################

# tema monocromático costuma pedir quinas retas; deixa 0 se preferir
corner-radius = 0;

rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'"
];

#################################
#   Outras janelas / regras gerais
#################################

mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
detect-client-leader = true;
use-ewmh-active-win = true;

wintypes:
{
  tooltip = { fade = true; shadow = false; opacity = 0.9; focus = true; full-shadow = false; };
  dock = { shadow = false; clip-shadow-above = true; };
  dnd = { shadow = false; };
  popup_menu = { opacity = 0.95; };
  dropdown_menu = { opacity = 0.95; };
};
